<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sala de sistemas — Animación de personajes</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#e9e4d8; font-family:"Segoe UI",Arial,sans-serif; padding:24px;
  }

  .room{
    position:relative; width:960px; max-width:100%; border-radius:22px; overflow:hidden;
    background:linear-gradient(to bottom, #efe9dc 0%, #efe9dc 58%, #b5602f 58%, #c9713b 100%);
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    padding:50px 34px 60px;
  }
  .room::before{
    content:''; position:absolute; inset:0 0 42% 0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 90px);
  }
  .room::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:42%;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 70px),
               repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 70px);
  }

  .titulo{position:relative; z-index:3; text-align:center; color:#3d3226; margin:0 0 34px;}
  .titulo h1{font-size:19px; margin:0 0 4px; font-weight:700;}
  .titulo p{font-size:12.5px; margin:0; opacity:.75;}

  .grid{
    position:relative; z-index:3;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:56px 18px;
  }

  .estacion{
    position:relative; display:flex; flex-direction:column; align-items:center;
    perspective:700px;
  }

  .burbuja{
    position:absolute; bottom:100%; margin-bottom:14px; min-width:118px; max-width:150px;
    background:#fff; border-radius:14px; padding:8px 10px; box-shadow:0 4px 10px rgba(0,0,0,.15);
    font-size:11px; color:#333; opacity:0; transform:translateY(6px) scale(.9);
    z-index:5;
  }
  .burbuja::after{
    content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#fff;
  }
  .burbuja.anim{ animation:popIn .35s ease forwards; }
  @keyframes popIn{ to{opacity:1; transform:translateY(0) scale(1);} }

  .b-head{display:flex; align-items:center; gap:5px; font-weight:700; font-size:10.5px; margin-bottom:4px;}
  .b-icon{width:16px; height:16px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; flex-shrink:0;}
  .ic-texto{background:#2f80ed;}
  .ic-codigo{background:#7b2cbf;}
  .ic-imagen{background:#0e9c7c;}

  .dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:#2f80ed; margin-right:3px; animation:dotPulse 1s infinite;}
  .dots span:nth-child(2){animation-delay:.15s;}
  .dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,100%{opacity:.25;}50%{opacity:1;}}

  .linea-msg{height:6px; background:#dbe8fd; border-radius:3px; width:0%; animation:growLine 1.4s ease forwards .3s;}
  @keyframes growLine{to{width:100%;}}

  .code-line{height:6px; border-radius:3px; margin-bottom:4px; width:0%; animation:growLine .7s ease forwards;}
  .code-line:nth-child(1){background:#c9a8f5; animation-delay:.1s;}
  .code-line.l2{background:#9adbc7; animation-delay:.5s; animation-name:growLine70;}
  @keyframes growLine70{to{width:70%;}}
  .code-line:nth-child(3){background:#f6c78a; animation-delay:.9s;}

  .img-frame{width:100%; height:46px; border-radius:6px; overflow:hidden; position:relative; background:#eaf7f2; border:1px solid #cdeee0;}
  .img-scene{position:absolute; inset:0; clip-path:inset(0 0 100% 0); animation:reveal 1.6s ease forwards .1s;}
  @keyframes reveal{to{clip-path:inset(0 0 0% 0);}}
  .img-sol{position:absolute; top:6px; right:10px; width:10px; height:10px; border-radius:50%; background:#f5b942;}
  .img-monte{position:absolute; bottom:0; left:0; width:0; height:0; border-left:22px solid transparent; border-right:22px solid transparent; border-bottom:26px solid #6fae5c;}
  .img-monte2{position:absolute; bottom:0; left:20px; width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-bottom:18px solid #4f8f45;}

  .personaje{position:relative; transform:rotateX(4deg); transform-origin:bottom center;}
  .cabeza{width:34px; height:30px; border-radius:12px 12px 10px 10px; position:relative; margin:0 auto;}
  .cabeza::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:2px; height:10px; background:#555;
  }
  .cabeza::after{
    content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:#e94b4b;
  }
  .visor{position:absolute; left:6px; right:6px; top:11px; height:8px; background:#1c1c1c; border-radius:4px;}
  .cuerpo{width:44px; height:36px; border-radius:8px; margin:2px auto 0; position:relative;}
  .torso-icono{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:10px; height:10px; border:2px solid rgba(0,0,0,.35); border-radius:50%;}

  .verde .cabeza, .verde .cuerpo{background:#5cb86c;}
  .amarillo .cabeza, .amarillo .cuerpo{background:#f2b705;}
  .beige .cabeza, .beige .cuerpo{background:#d8b48a;}

  .escritorio{width:78px; height:14px; background:#e4e4e4; border-radius:3px; margin-top:6px; position:relative; box-shadow:0 3px 6px rgba(0,0,0,.15);}
  .laptop{position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:30px; height:11px; background:#3a3a3a; border-radius:2px 2px 0 0;}
  .laptop::before{content:''; position:absolute; top:1px; left:1px; right:1px; bottom:1px; background:#5fa8ff; opacity:.5; border-radius:1px;}

  @media(max-width:700px){ .grid{grid-template-columns:repeat(2,1fr); gap:60px 10px;} }
</style>
</head>
<body>

<div class="room">
  <div class="titulo">
    <h1>Sala de sistemas — trabajo colaborativo</h1>
    <p>Cada aprendiz alterna entre tres actividades: enviar mensajes, escribir código y generar imágenes.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const COLORES = ['verde','amarillo','beige'];

function plantillaTexto(){
  return `<div class="b-head"><div class="b-icon ic-texto">&#9993;</div>Mensaje</div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="linea-msg"></div>`;
}
function plantillaCodigo(){
  return `<div class="b-head"><div class="b-icon ic-codigo">&lt;/&gt;</div>Código</div>
    <div class="code-line"></div>
    <div class="code-line l2"></div>
    <div class="code-line" style="width:0%"></div>`;
}
function plantillaImagen(){
  return `<div class="b-head"><div class="b-icon ic-imagen">&#9635;</div>Imagen</div>
    <div class="img-frame"><div class="img-scene"><div class="img-sol"></div><div class="img-monte2"></div><div class="img-monte"></div></div></div>`;
}
const PLANTILLAS = [plantillaTexto, plantillaCodigo, plantillaImagen];

function crearEstacion(index){
  const color = COLORES[index % COLORES.length];
  const est = document.createElement('div');
  est.className = 'estacion';
  est.innerHTML = `
    <div class="burbuja" id="bubble-${index}"></div>
    <div class="personaje ${color}">
      <div class="cabeza"><div class="visor"></div></div>
      <div class="cuerpo"><div class="torso-icono"></div></div>
    </div>
    <div class="escritorio"><div class="laptop"></div></div>`;
  return est;
}

const grid = document.getElementById('grid');
const TOTAL = 8;
for(let i=0;i<TOTAL;i++){ grid.appendChild(crearEstacion(i)); }

function setBubble(index, tipoIdx){
  const el = document.getElementById('bubble-'+index);
  el.classList.remove('anim');
  el.innerHTML = PLANTILLAS[tipoIdx]();
  void el.offsetWidth;
  el.classList.add('anim');
}

for(let i=0;i<TOTAL;i++){
  let tipo = i % 3;
  setTimeout(()=>{
    setBubble(i, tipo);
    setInterval(()=>{
      tipo = (tipo+1) % 3;
      setBubble(i, tipo);
    }, 3400);
  }, i * 260);
}
</script>

</body>
</html>
