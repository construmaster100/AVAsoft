<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario · SENAEnglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-eyebrow">SENAEnglish · Evaluación de inglés</span>
        <h1>Cuestionario — IF · THEN · USED TO · INFINITIVE</h1>
      </div>
      <div class="topbar-status" id="status-panel">
        <div class="status-zone">
          <span class="status-label">Pregunta</span>
          <span class="status-value" id="progreso-actual">—</span>
        </div>
        <div class="status-coords">
          <span id="progreso-texto">— / 30</span>
          <span id="progreso-categoria">—</span>
        </div>
      </div>
    </header>

    <main class="stage quiz-stage">

      <section class="quiz-frame" id="quiz-frame">
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progress-fill"></div></div>

        <div class="question-card" id="question-card">
          <span class="question-category" id="question-category">—</span>
          <p class="question-text" id="question-text">Cargando pregunta…</p>
        </div>

        <div class="options-grid" id="options-grid"></div>
      </section>

      <aside class="side-panel">

        <div class="player-panel">
          <span class="color-dot" id="player-color-dot"></span>
          <div class="player-panel-info">
            <span id="player-name">—</span>
            <span class="player-score">Score: <strong id="player-score">0</strong> / 30</span>
          </div>
          <button type="button" class="logout-btn" id="btn-salir" title="Salir de la evaluación">Salir</button>
        </div>

        <div class="sidebar-panel">
          <div class="minimap-heading"><span>Ranking · hasta 20</span><span id="ranking-count">0</span></div>
          <table class="ranking-table" id="ranking-table">
            <thead><tr><th>Pos.</th><th>Usuario</th><th></th><th>Aciertos</th><th>Score</th></tr></thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>

      </aside>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../assets/js/senaenglish-client.js"></script>
  <script src="../assets/js/quiz.js"></script>
</body>
</html>
