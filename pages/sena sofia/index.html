<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SofiaPlus · Ingreso Usuarios Registrados</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ CARRUSEL DE FONDO ============ -->
  <div class="bg-carousel" id="bgCarousel" aria-hidden="true">
    <!-- Las láminas las inyecta el script a partir de la lista SLIDES,
         que apunta a los archivos con prefijo «sld» de «fotos de fondo». -->
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- ============ TARJETA DE LOGIN ============ -->
  <main class="login-wrap">
    <div class="login-card">

      <img class="login-encabezado" src="fotos de fondo/encabezadologin.JPG"
           width="373" height="120"
           alt="SofiaPlus versi&oacute;n 8.5.0 &middot; SENA &middot; Ingreso usuarios registrados">

      <h1 class="visually-hidden">Ingreso usuarios registrados</h1>

      <form id="loginForm" novalidate>

        <label class="field field-select">
          <span class="field-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 16.2c.5-1.6 1.7-2.4 3-2.4s2.5.8 3 2.4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M14 9h6M14 12.5h6M14 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <select id="docType" name="docType">
            <option value="CC">Cédula de Ciudadanía</option>
            <option value="CE">Cédula de Extranjería</option>
            <option value="TI">Tarjeta de Identidad</option>
            <option value="PA">Pasaporte</option>
            <option value="PEP">Permiso Especial de Permanencia</option>
          </select>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>

        <label class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="docNumber" name="docNumber" placeholder="Número de Documento" autocomplete="username" inputmode="numeric">
        </label>

        <label class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </label>

        <a href="#" class="forgot-link">
          <svg viewBox="0 0 24 24"><path d="M15 7a4 4 0 1 0-3.9 5H15l2 2 1.5-1.5L17 11h-.1A4 4 0 0 0 15 7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 22l7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Olvidé mi contraseña
        </a>

        <p class="error-msg" id="errorMsg" hidden>Ingresa tu número de documento y contraseña.</p>

        <button type="submit" class="btn-ingresar">INGRESAR</button>

        <a href="#" class="blocked-link">Su usuario está Bloqueado o Inactivo?</a>

      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
