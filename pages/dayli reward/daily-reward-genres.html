<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reward + Géneros</title>
<style>
  :root{
    --bg-app: #14161c;
    --sidebar-bg: #1b1e26;
    --sidebar-texto: #c7cbd6;
    --sidebar-activo-bg: #000000;
    --sidebar-activo-texto: #ffffff;
    --sidebar-borde: #2a2e38;
    --badge-bg: #d7e850;
    --badge-texto: #2b2b1a;

    --card-bg: linear-gradient(160deg, #223049, #182238);
    --card-borde: #2f4869;
    --titulo: #7fd8ff;
    --dia-borde: #2c3f5c;
    --dia-bg: #1c2c45;
    --dia-texto: #7f93b3;
    --gema: #4fc3ff;
    --oro-borde: #ffb703;
    --oro-bg-1: #ffd766;
    --oro-bg-2: #ffb703;
    --oro-texto: #7a4c00;
    --verde-1: #3fe08a;
    --verde-2: #16b95e;
    --azul-btn-1: #24344e;
    --azul-btn-2: #1a2740;
    --azul-btn-texto: #cfe6ff;
    --fuego: #ff8a00;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-app);
    min-height:100vh;
    display:flex;
  }

  /* ================= SIDEBAR (géneros) ================= */
  .sidebar{
    width: 230px;
    min-width: 230px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-borde);
    padding: 20px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    height:100vh;
    position:sticky;
    top:0;
    overflow-y:auto;
  }

  .genre{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--sidebar-texto);
    font-size: 14.5px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
  }

  .genre:hover{ background: rgba(255,255,255,0.05); }

  .genre.active{
    background: var(--sidebar-activo-bg);
    color: var(--sidebar-activo-texto);
  }

  .genre .icon{
    width:22px;
    font-size:16px;
    text-align:center;
    flex-shrink:0;
  }

  .multi-icon{
    width:16px; height:16px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:2px;
  }
  .multi-icon span{ border-radius:2px; }
  .multi-icon span:nth-child(1){ background:#ff4d5e; }
  .multi-icon span:nth-child(2){ background:#3fd67a; }
  .multi-icon span:nth-child(3){ background:#4fc3ff; }
  .multi-icon span:nth-child(4){ background:#ffd166; }

  .genre .badge{
    margin-left:auto;
    background: var(--badge-bg);
    color: var(--badge-texto);
    font-size: 10.5px;
    font-weight:800;
    padding: 1px 6px;
    border-radius: 999px;
  }

  @media (max-width: 760px){
    .sidebar{ width:64px; min-width:64px; padding:16px 6px; }
    .genre span:not(.icon):not(.multi-icon){ display:none; }
    .genre{ justify-content:center; }
    .genre .badge{ display:none; }
  }

  /* ================= MAIN ================= */
  .main{
    flex:1;
    padding: 40px 32px;
    display:flex;
    justify-content:center;
  }

  /* ---------------- REWARD CARD (mejorada) ---------------- */
  .dr-card{
    width: 100%;
    max-width: 460px;
    background: var(--card-bg);
    border: 1px solid var(--card-borde);
    border-radius: 24px;
    padding: 28px 24px 24px;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    position:relative;
    overflow:hidden;
  }

  .dr-card::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:180px; height:180px;
    background: radial-gradient(circle, rgba(79,195,255,0.18), transparent 70%);
    pointer-events:none;
  }

  .dr-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color: var(--titulo);
    font-size: 23px;
    font-weight: 800;
    letter-spacing:.02em;
  }

  .dr-streak{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color: var(--fuego);
    font-weight:700;
    font-size:13px;
  }

  .dr-streak .flame{
    display:inline-block;
    transition: transform .25s ease, filter .25s ease;
  }

  .dr-timer{
    margin-top:6px;
    font-size:11.5px;
    color:#8ea0bd;
    letter-spacing:.02em;
    min-height:14px;
  }

  .dr-progressbar{
    margin: 14px auto 18px;
    height: 7px;
    width: 92%;
    background: #1b2942;
    border-radius: 999px;
    overflow:hidden;
    position:relative;
  }
  .dr-progressbar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--fuego), #ffd166);
    border-radius:999px;
    transition: width .4s ease;
    position:relative;
    overflow:hidden;
  }
  .dr-progressbar-fill::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
    animation: dr-shine 2.2s linear infinite;
  }
  @keyframes dr-shine{
    from{ transform: translateX(-100%); }
    to{ transform: translateX(100%); }
  }

  .dr-days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 6px 2px 12px;
    justify-content:center;
  }

  .dr-day{
    flex:0 0 auto;
    width: 60px;
    min-height: 76px;
    border-radius: 14px;
    border: 2px solid var(--dia-borde);
    background: var(--dia-bg);
    color: var(--dia-texto);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10.5px;
    font-weight:700;
    padding:8px 3px;
    transition: transform .18s ease;
    position:relative;
  }

  .dr-day .amount{
    display:flex; align-items:center; gap:2px;
    font-size:12px; font-weight:800;
  }
  .dr-day .amount .gem{ color: var(--gema); font-size:11px; }

  .dr-day.today{
    border-color: var(--oro-borde);
    background: linear-gradient(180deg, var(--oro-bg-1), var(--oro-bg-2));
    color: var(--oro-texto);
    transform: translateY(-5px) scale(1.08);
    box-shadow: 0 0 0 4px rgba(255,183,3,0.18), 0 10px 20px rgba(255,183,3,0.35);
    animation: dr-pulse 1.8s ease-in-out infinite;
  }
  .dr-day.today .amount .gem{ color: var(--oro-texto); }

  @keyframes dr-pulse{
    0%, 100%{ box-shadow: 0 0 0 4px rgba(255,183,3,0.18), 0 10px 20px rgba(255,183,3,0.35); }
    50%{ box-shadow: 0 0 0 8px rgba(255,183,3,0.05), 0 10px 24px rgba(255,183,3,0.45); }
  }

  .dr-day.claimed{ opacity:.4; }
  .dr-day.claimed::after{
    content:"✓";
    position:absolute;
    top:4px; right:6px;
    font-size:12px;
    color: var(--verde-1);
  }

  .dr-day.bonus{ border-style:dashed; }

  .dr-claim-btn{
    width:100%;
    margin-top:8px;
    padding:15px;
    border-radius:999px;
    border:none;
    background: linear-gradient(180deg, var(--verde-1), var(--verde-2));
    color:white;
    font-weight:800;
    font-size:15px;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow: 0 6px 0 #0c9a4c;
    transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .dr-claim-btn:hover:not(:disabled){ filter:brightness(1.05); }
  .dr-claim-btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 2px 0 #0c9a4c; }
  .dr-claim-btn:disabled{
    background:#3a4557;
    color:#8b97ab;
    box-shadow: 0 6px 0 #2a3242;
    cursor:not-allowed;
  }

  .dr-back-btn{
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:999px;
    border:none;
    background: linear-gradient(180deg, var(--azul-btn-1), var(--azul-btn-2));
    color: var(--azul-btn-texto);
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow: 0 5px 0 #101a2c;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .dr-back-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 #101a2c; }

  /* confetti burst */
  .dr-confetti{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    border-radius:24px;
  }
  .confetti-piece{
    position:absolute;
    top:44%;
    left:50%;
    width:7px; height:10px;
    opacity:0;
  }
  @keyframes confetti-fall{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
  }
  .confetti-piece.play{
    animation: confetti-fall .9s ease-out forwards;
  }

  @media (max-width: 420px){
    .dr-day{ width:52px; min-height:68px; }
    .dr-title{ font-size:19px; }
    .main{ padding:24px 14px; }
  }
</style>
</head>
<body>

<!-- ================= SIDEBAR: géneros ================= -->
<aside class="sidebar">
  <a class="genre">
    <span class="icon"><span class="multi-icon"><span></span><span></span><span></span><span></span></span></span>
    <span>Multijugador</span>
    <span class="badge">4</span>
  </a>
  <a class="genre"><span class="icon">🧑‍🤝‍🧑</span><span>2 Jugadores</span></a>
  <a class="genre active"><span class="icon">⚔️</span><span>Acción</span></a>
  <a class="genre"><span class="icon">🚩</span><span>Aventuras</span></a>
  <a class="genre"><span class="icon">🏎️</span><span>Carreras</span></a>
  <a class="genre"><span class="icon">👾</span><span>Clásicos</span></a>
  <a class="genre"><span class="icon">🍄</span><span>Mario Bros</span></a>
  <a class="genre"><span class="icon">🧸</span><span>Infantiles</span></a>
  <a class="genre"><span class="icon">🔴</span><span>Pokemon</span></a>
  <a class="genre"><span class="icon">♠️</span><span>Mesa</span></a>
  <a class="genre"><span class="icon">🃏</span><span>Cartas</span></a>
  <a class="genre"><span class="icon">⚽</span><span>Fútbol</span></a>
  <a class="genre"><span class="icon">🚗</span><span>Coches</span></a>
  <a class="genre"><span class="icon">🏍️</span><span>Motos</span></a>
</aside>

<!-- ================= MAIN: Daily Reward mejorada ================= -->
<main class="main">
  <div class="dr-card" id="drCard">
    <div class="dr-confetti" id="drConfetti"></div>

    <div class="dr-title">🎁 DAILY REWARD</div>
    <div class="dr-streak">
      <span class="flame" id="drFlame">🔥</span>
      <span id="drStreakLabel">STREAK: 0 / 7</span>
    </div>
    <div class="dr-timer" id="drTimer"></div>

    <div class="dr-progressbar">
      <div class="dr-progressbar-fill" id="drProgressFill" style="width:0%"></div>
    </div>

    <div class="dr-days" id="drDaysRow"></div>

    <button class="dr-claim-btn" id="drClaimBtn">
      <span>🎁</span> <span id="drClaimLabel">CLAIM 25</span> <span class="gem">◈</span>
    </button>

    <button class="dr-back-btn" id="drBackBtn">← BACK</button>
  </div>
</main>

<script>
  /*
    Componente Daily Reward (versión mejorada) — listo para integrar.
    Mejoras sobre la v1:
      - Racha con llama que crece/se anima según el streak
      - Contador "próxima recompensa" tras reclamar
      - Confetti al reclamar
      - Brillo animado en la barra de progreso
      - Pulso en el día activo
      - Recompensa bonus (día 7) marcada con borde punteado

    API pública:
      DailyReward.claim()  -> reclama el día actual
      DailyReward.reset()  -> reinicia el streak
  */
  const DailyRewardConfig = {
    rewards: [25, 40, 60, 80, 100, 150, 200],
    streak: 0,
    claimedToday: false,
    nextClaimAt: null // timestamp ms
  };

  const daysRow = document.getElementById('drDaysRow');
  const streakLabel = document.getElementById('drStreakLabel');
  const progressFill = document.getElementById('drProgressFill');
  const claimBtn = document.getElementById('drClaimBtn');
  const claimLabel = document.getElementById('drClaimLabel');
  const backBtn = document.getElementById('drBackBtn');
  const flame = document.getElementById('drFlame');
  const timerEl = document.getElementById('drTimer');
  const confettiLayer = document.getElementById('drConfetti');
  const card = document.getElementById('drCard');

  function updateFlame(){
    const s = DailyRewardConfig.streak;
    const scale = 1 + Math.min(s, 7) * 0.06;
    flame.style.transform = `scale(${scale})`;
    flame.style.filter = s >= 5 ? 'drop-shadow(0 0 6px rgba(255,138,0,0.7))' : 'none';
  }

  function renderDays(){
    daysRow.innerHTML = '';
    const totalDays = DailyRewardConfig.rewards.length;
    const currentDayIndex = DailyRewardConfig.streak;

    DailyRewardConfig.rewards.forEach((amount, i) => {
      const dayNum = i + 1;
      const el = document.createElement('div');
      el.className = 'dr-day';
      if (i < currentDayIndex) el.classList.add('claimed');
      if (i === currentDayIndex && !DailyRewardConfig.claimedToday) el.classList.add('today');
      if (dayNum === totalDays) el.classList.add('bonus');

      el.innerHTML = `
        <span class="label">DAY ${dayNum}</span>
        <span class="amount"><span class="gem">◈</span>${amount}</span>
      `;
      daysRow.appendChild(el);
    });

    streakLabel.textContent = `STREAK: ${DailyRewardConfig.streak} / ${totalDays}`;
    progressFill.style.width = (DailyRewardConfig.streak / totalDays * 100) + '%';
    updateFlame();

    const nextReward = DailyRewardConfig.rewards[currentDayIndex] ?? null;
    if (nextReward === null){
      claimLabel.textContent = 'COMPLETADO';
      claimBtn.disabled = true;
      timerEl.textContent = '¡Racha completa! Vuelve a empezar mañana';
    } else if (DailyRewardConfig.claimedToday){
      claimLabel.textContent = 'RECLAMADO HOY';
      claimBtn.disabled = true;
      startTimer();
    } else {
      claimLabel.textContent = `CLAIM ${nextReward}`;
      claimBtn.disabled = false;
      timerEl.textContent = '';
    }
  }

  let timerInterval = null;
  function startTimer(){
    if (!DailyRewardConfig.nextClaimAt) {
      DailyRewardConfig.nextClaimAt = Date.now() + 24*60*60*1000; // demo: 24h
    }
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const diff = DailyRewardConfig.nextClaimAt - Date.now();
      if (diff <= 0){
        timerEl.textContent = '¡Nueva recompensa disponible!';
        DailyRewardConfig.claimedToday = false;
        DailyRewardConfig.nextClaimAt = null;
        clearInterval(timerInterval);
        renderDays();
        return;
      }
      const h = String(Math.floor(diff/3600000)).padStart(2,'0');
      const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
      const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
      timerEl.textContent = `Próxima recompensa en ${h}:${m}:${s}`;
    }, 1000);
  }

  function burstConfetti(){
    const colors = ['#ffd166','#4fc3ff','#3fe08a','#ff6b6b','#c792ff'];
    for (let i=0; i<24; i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random()*90;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist - 40 + 'px');
      p.style.setProperty('--rot', (Math.random()*360) + 'deg');
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      confettiLayer.appendChild(p);
      requestAnimationFrame(() => p.classList.add('play'));
      setTimeout(() => p.remove(), 950);
    }
  }

  const DailyReward = {
    claim(){
      if (DailyRewardConfig.claimedToday) return;
      if (DailyRewardConfig.streak >= DailyRewardConfig.rewards.length) return;

      const reward = DailyRewardConfig.rewards[DailyRewardConfig.streak];
      DailyRewardConfig.streak += 1;
      DailyRewardConfig.claimedToday = true;

      burstConfetti();
      card.animate(
        [{ transform:'scale(1)' }, { transform:'scale(1.02)' }, { transform:'scale(1)' }],
        { duration: 260, easing: 'ease-out' }
      );

      renderDays();
      return reward;
    },
    reset(){
      DailyRewardConfig.streak = 0;
      DailyRewardConfig.claimedToday = false;
      DailyRewardConfig.nextClaimAt = null;
      clearInterval(timerInterval);
      renderDays();
    }
  };

  claimBtn.addEventListener('click', () => DailyReward.claim());
  backBtn.addEventListener('click', () => DailyReward.reset());

  // Navegación simple del sidebar de géneros (resalta el clicado)
  document.querySelectorAll('.genre').forEach(g => {
    g.addEventListener('click', () => {
      document.querySelectorAll('.genre').forEach(x => x.classList.remove('active'));
      g.classList.add('active');
    });
  });

  window.DailyReward = DailyReward;
  renderDays();
</script>

</body>
</html>
