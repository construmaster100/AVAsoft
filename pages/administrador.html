<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración · CIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="board-body">

  <main class="board-wrap admin-wrap">
    <header class="board-header">
      <span class="topbar-eyebrow">CIA · Cancha Interactiva Asincrónica</span>
      <h1>Panel de administración</h1>
      <p id="connected-count" class="board-sub">— jugadores conectados</p>
      <button type="button" class="action-btn action-color" id="btn-reiniciar">Reiniciar partida</button>
    </header>

    <div class="admin-grid">
      <section class="sidebar-panel admin-section">
        <div class="minimap-heading"><span>Jugadores</span><span id="players-total">0</span></div>
        <table class="admin-table">
          <thead><tr><th>Color</th><th>Nombre</th><th>Fila</th><th>Col</th><th>Score</th><th>Estado</th></tr></thead>
          <tbody id="tabla-jugadores"></tbody>
        </table>
      </section>

      <section class="sidebar-panel admin-section">
        <div class="minimap-heading"><span>TOP 5 SCORES</span></div>
        <ol class="top5-list" id="top5-list"></ol>
      </section>

      <section class="sidebar-panel admin-section admin-section-wide">
        <div class="minimap-heading"><span>Estado del tablero (70 celdas)</span><span id="celdas-jugadas">0 jugadas</span></div>
        <div class="admin-table-scroll">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Fila</th><th>Col</th><th>Marca</th><th>Color</th><th>Jugador</th><th>Puntos</th></tr></thead>
            <tbody id="tabla-tablero"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../assets/js/game-client.js"></script>
  <script>
    const tablaJugadores = document.getElementById("tabla-jugadores");
    const tablaTablero = document.getElementById("tabla-tablero");
    const top5List = document.getElementById("top5-list");
    const connectedCount = document.getElementById("connected-count");
    const playersTotal = document.getElementById("players-total");
    const celdasJugadas = document.getElementById("celdas-jugadas");
    let paletaPorId = {};
    let nombresPorId = {};

    function renderJugadores(jugadores) {
      const conectados = jugadores.filter((j) => j.conectado);
      connectedCount.textContent = `${conectados.length} jugador${conectados.length === 1 ? "" : "es"} conectado${conectados.length === 1 ? "" : "s"}`;
      playersTotal.textContent = jugadores.length;
      nombresPorId = Object.fromEntries(jugadores.map((j) => [j.id, j.nombre]));
      tablaJugadores.innerHTML = "";
      jugadores.forEach((j) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="color-dot" style="background:${paletaPorId[j.color] || "#999"}"></span></td>
          <td>${j.nombre}</td><td>${j.fila + 1}</td><td>${j.columna + 1}</td><td>${j.score}</td>
          <td>${j.conectado ? "Conectado" : "Desconectado"}</td>`;
        tablaJugadores.appendChild(tr);
      });
    }

    function renderTop5(top5) {
      top5List.innerHTML = "";
      top5.forEach((j) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="color-dot" style="background:${paletaPorId[j.color] || "#999"}"></span>
          <span class="players-list-name">${j.nombre}</span><span class="players-list-score">${j.score}</span>`;
        top5List.appendChild(li);
      });
    }

    function renderTablero(tablero) {
      let jugadas = 0;
      tablaTablero.innerHTML = "";
      tablero.forEach((celda) => {
        if (celda.marca || celda.color) jugadas++;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${celda.id}</td><td>${celda.fila + 1}</td><td>${celda.columna + 1}</td>
          <td>${celda.marca || "—"}</td>
          <td>${celda.color ? `<span class="color-dot" style="background:${paletaPorId[celda.color] || "#999"}"></span>` : "—"}</td>
          <td>${celda.jugadorId ? (nombresPorId[celda.jugadorId] || "?") : "—"}</td>
          <td>${celda.puntosOtorgados ? 3 : 0}</td>`;
        tablaTablero.appendChild(tr);
      });
      celdasJugadas.textContent = `${jugadas} jugadas`;
    }

    function aplicarEstado(estado) {
      estado.config.paleta.forEach((c) => { paletaPorId[c.id] = c.hex; });
      renderJugadores(estado.jugadores);
      renderTop5(estado.top5);
      renderTablero(estado.tablero);
    }

    CIA.observar().then(aplicarEstado);
    CIA.socket.on("jugador_nuevo", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_reconectado", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_desconectado", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_movido", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_actualizado", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("celda_actualizada", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("top5_actualizado", renderTop5);
    CIA.socket.on("estado_inicial", aplicarEstado);

    document.getElementById("btn-reiniciar").addEventListener("click", () => {
      if (confirm("¿Reiniciar la partida? Se borran las marcas, colores y puntajes.")) {
        CIA.reiniciarPartida();
      }
    });
  </script>
</body>
</html>
